name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # GitVersion needs full history + tags to compute the version.
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '6.x'

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3

      - name: Build and test with computed version
        env:
          GITVERSION_SEMVER: ${{ steps.gitversion.outputs.semVer }}
        run: mvn --batch-mode -Drevision="${GITVERSION_SEMVER}" clean verify

      - name: Upload .hpi artifact
        uses: actions/upload-artifact@v4
        with:
          name: config-template-sync-${{ steps.gitversion.outputs.semVer }}
          path: target/*.hpi
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '6.x'

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3

      - name: Build with computed version
        env:
          GITVERSION_SEMVER: ${{ steps.gitversion.outputs.semVer }}
        run: mvn --batch-mode -Drevision="${GITVERSION_SEMVER}" clean verify

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/*.hpi
          generate_release_notes: true
