# Release workflow: a pushed `vX.Y.Z` tag builds, tests and publishes the plugin automatically.
#
# Mirrors the conventions of the owner's other repo (Retro-kharkov1/chatdock,
# .github/workflows/release.yml): trigger on `v*.*.*` tags (+ manual dispatch), built
# artifacts attached to the GitHub Release as assets, authenticated with the built-in
# GITHUB_TOKEN only (no PAT, no extra secrets). The tag is only the release marker/label; the
# plugin version is NOT derived from it (see below).
#
# What one run does, in order (each step gates the next; a red step publishes nothing after it):
#   1. checkout the tag with FULL history (the git-changelist extension counts commits)
#   2. `mvn clean verify` -- the whole test suite is the release gate; the version is computed
#      by .mvn/extensions.xml (git-changelist-maven-extension) when `-Dset.changelist` is passed
#   3. read Plugin-Version from the .hpi manifest and check it is a release version of the form
#      `<commit count>.v<commit hash>` (no SNAPSHOT / 999999 fallback)
#   4. stage assets: job-config-chain-<version>.hpi, job-config-chain.hpi, SHA256SUMS
#   5. create/update the GitHub Release for the tag (body from .github/release-notes/<tag>.md
#      when that file exists, otherwise auto-generated notes) and upload the assets
#   6. publish the same version to GitHub Packages (Maven registry)
#
# Why Packages is folded in here and not left on `release: published`: a release created with
# the built-in GITHUB_TOKEN does NOT trigger other workflows (GitHub's recursion guard,
# https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication),
# so publish-github-packages.yaml would silently never fire. That workflow is now
# workflow_dispatch-only and serves as a manual re-publish fallback.
#
# Version scheme: pom.xml is `${changelist}` (Jenkins CD, JEP-229). The git-changelist extension
# computes `<commit count>.v<12-char hash>` (e.g. 1234.vabcdef012345) from the checked-out
# commit, but ONLY when `-Dset.changelist` is passed (otherwise the build stays 999999-SNAPSHOT);
# this workflow and jenkinsci's cd.yaml both pass it. The extension refuses a dirty working tree. The version is
# therefore NOT the tag: tag v0.2.0 yields e.g. job-config-chain-1234.vabcdef012345.hpi.
#
# FUTURE (Jenkins CD): once the repo is forked into the jenkinsci org, official releases go
# through cd.yaml (maven-cd reusable workflow, git-changelist-maven-extension) and this
# workflow is retired or reduced to GitHub-only mirrors. Nothing here touches cd.yaml, and
# the `-Pgithub-packages` profile keeps distributionManagement out of the official path.
#
# Recovery model: fix forward. A failed run before step 6 publishes nothing; fix and push a
# new tag (or re-run this workflow). Steps 6 and 7 are re-runnable, except that GitHub Packages
# rejects re-publishing an existing release version -- use a new patch version in that case.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re-)release, e.g. v0.1.0. Empty = the tag this run was started from (choose "Use workflow from: Tag").'
        required: false
        type: string

permissions:
  contents: write   # create/update the Release and upload assets
  packages: write   # publish to GitHub Packages (Maven registry)

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ] && [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          fi
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Release tag must look like vX.Y.Z; got '${TAG}'. Start the run from a tag or set the 'tag' input."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          # git-changelist counts commits; a shallow clone would compute a wrong version number.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          # JDK 21 to RUN Maven/maven-hpi-plugin; bytecode target stays maven.compiler.release=17.
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github # matches <id>github</id> in pom.xml's github-packages profile

      - name: Build and test (release gate)
        # `mvn` (preinstalled on the runner). -Dset.changelist activates the version computation.
        run: >
          mvn -B
          -Dset.changelist
          -Dmaven.clean.failOnError=false
          clean verify

      - name: Stage release assets
        id: assets
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # The version is whatever the git-changelist extension computed; fail closed unless it
          # is a real release version (<commit count>.v<hash>), not the 999999-SNAPSHOT fallback.
          VERSION="$(unzip -p target/job-config-chain.hpi META-INF/MANIFEST.MF | tr -d '\r' | sed -n 's/^Plugin-Version: //p')"
          echo "Plugin-Version in .hpi manifest: '$VERSION'"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.v[0-9a-f]+$'; then
            echo "::error::.hpi Plugin-Version '${VERSION}' is not a release version (<commit count>.v<hash>); shallow checkout or git-changelist extension inactive?"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p release-assets
          cp target/job-config-chain.hpi "release-assets/job-config-chain-${VERSION}.hpi"
          cp target/job-config-chain.hpi release-assets/job-config-chain.hpi
          (cd release-assets && sha256sum "job-config-chain-${VERSION}.hpi" job-config-chain.hpi > SHA256SUMS && cat SHA256SUMS)
          # Release body: committed notes for this tag win over auto-generated ones.
          NOTES=".github/release-notes/${TAG}.md"
          if [ -f "$NOTES" ]; then
            echo "body_path=$NOTES" >> "$GITHUB_OUTPUT"
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "body_path=" >> "$GITHUB_OUTPUT"
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Job Config Chain ${{ steps.tag.outputs.tag }} (${{ steps.assets.outputs.version }})
          body_path: ${{ steps.assets.outputs.body_path }}
          generate_release_notes: ${{ steps.assets.outputs.generate == 'true' }}
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release-assets/job-config-chain-${{ steps.assets.outputs.version }}.hpi
            release-assets/job-config-chain.hpi
            release-assets/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        # Tests already ran in the gate above, so they are skipped here; the staged release
        # assets are copies taken before this step. -Pgithub-packages opts into the
        # distributionManagement profile (kept out of the default/official path in pom.xml).
        run: >
          mvn -B -Pgithub-packages
          -Dset.changelist
          -DskipTests
          deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
