<div>
  将配置中的机密值绑定到 Jenkins 凭据，使真实值永远不会出现在配置集或其版本历史中。
  <p><b>点分路径:</b> 值在文档中的位置，各个键以点连接，例如 <code>database.password</code>。在此路径上，编辑器只能包含字面占位符 <code>__SECRET__</code>；在此处保存其他任何内容都会被拒绝。</p>
  <p><b>凭据:</b> 在流水线解析配置时提供真实值的 Jenkins 凭据。此处仅存储凭据 ID，绝不存储机密本身。列表中显示的是 Jenkins 管理员可用的凭据。</p>
  <p><b>绑定凭据</b>会添加该路径；如果该路径已在列表中，则替换其凭据。</p>
</div>
