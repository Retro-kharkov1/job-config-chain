<div>
  此编辑器的内容会叠加在已合并的基础配置集之上。只需写与基础不同的部分；您省略的每个键都会被继承。在 JSON 和 YAML 中，将键设置为 <code>null</code> 会将其从结果中移除。
  <p><b>数组会被整体替换。</b>对象按键合并，但列表 (JSON 数组、YAML 序列，或 XML 中重复的同级元素) 绝不会逐元素合并。如果基础中是 <code>[1, 2, 3]</code>，而此编辑器设置为 <code>[4]</code>，则结果是 <code>[4]</code>，而不是 <code>[1, 2, 3, 4]</code>。若要更改列表中的某一个元素，请在此处重复完整的列表。</p>
</div>
