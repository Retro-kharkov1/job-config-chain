  此編輯器的內容會疊加在已合併的基底設定集之上。只需寫出與基底不同的部分；您省略的每個鍵都會被繼承。在 JSON 與 YAML 中，將鍵設為 <code>null</code> 會將其從結果中移除。
  <p><b>陣列會被整個取代。</b>物件會依鍵合併，但清單 (JSON 陣列、YAML 序列，或 XML 中重複的同層元素) 絕不會逐元素合併。如果基底是 <code>[1, 2, 3]</code>，而此編輯器設為 <code>[4]</code>，則結果是 <code>[4]</code>，而不是 <code>[1, 2, 3, 4]</code>。若要變更清單中的某一個元素，請在此處重複完整的清單。</p>
