  시크릿 및 치환 토큰이 들어 있는, 바로 복사해 붙여넣을 수 있는 템플릿을 구성에서 생성하여 표시합니다. 작업 페이지에서는 저장 여부와 관계없이 편집기에 있는 그대로의 유효(병합된) 구성에서 생성됩니다. 전역 구성 세트 페이지에서는 저장되지 않은 편집 내용이 아니라 활성 버전만을 기준으로 생성됩니다. 생성해도 아무것도 저장되거나 변경되지 않습니다.
  <p>출력은 읽기 전용이므로 텍스트를 가져오려면 <b>클립보드에 복사</b>를 사용하세요. 작업 페이지에서는 <b>3분할 보기로 돌아가기</b>를 누르면 편집으로 돌아갑니다.</p>
