<div>
  <b>מפתח התצורה</b> נותן שם לערכת תצורה גלובלית (משותפת) חדשה. משימות מפנות אליה בשם הזה, בשרשרת הבסיס של משימה ובארגומנט <code>configKey</code> של שלבי ה-Pipeline.
  <p>ערכת התצורה נוצרת כשאתה שומר אותה לראשונה בעורך שלה, ולא כשאתה לוחץ על <b>פתח / צור</b>. שם של ערכת תצורה שנמחקה נשאר שמור עד שהיא משוחזרת או נמחקת לצמיתות.</p>
</div>
