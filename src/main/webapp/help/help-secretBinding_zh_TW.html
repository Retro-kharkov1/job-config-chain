<div>
  將設定中的機密值綁定至 Jenkins 憑證，使真實值永遠不會出現在設定集或其版本歷程中。
  <p><b>點分路徑:</b> 值在文件中的位置，各個鍵以點連接，例如 <code>database.password</code>。在此路徑上，編輯器只能包含字面預留位置 <code>__SECRET__</code>；在此儲存其他任何內容都會被拒絕。</p>
  <p><b>憑證:</b> 在管線解析設定時提供真實值的 Jenkins 憑證。此處僅儲存憑證 ID，絕不儲存機密本身。清單中顯示的是 Jenkins 管理員可用的憑證。</p>
  <p><b>綁定憑證</b>會新增該路徑；如果該路徑已在清單中，則取代其憑證。</p>
</div>
