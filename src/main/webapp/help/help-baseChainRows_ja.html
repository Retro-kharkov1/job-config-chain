  行は、上から順に折りたたまれたベース設定セットです。2 つの行が同じキーを設定している場合は後ろの行が優先されます。この設定セット自身の内容は最後に、その結果の上に適用されます。
  <p><b>設定キー:</b> この行が内容を取得するグローバル設定セットです。</p>
  <p><b>モード:</b> <b>アクティブ</b>は、その設定セットの現在アクティブなバージョンを常に追従するため、そこで新しいバージョンを有効化すると、ここでの結果も変わります。<b>固定</b>は行を 1 つのバージョンに固定し、固定を変更するまで同じままです。</p>
  <p><b>固定バージョン:</b> <b>固定</b>モードで使用されるバージョン番号です。<b>アクティブ</b>モードでは使用されません。</p>
</div>
