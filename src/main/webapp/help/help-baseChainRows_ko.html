<div>
  행은 위에서 아래로 합쳐지는 기본 구성 세트입니다. 두 행이 같은 키를 설정하면 뒤쪽 행이 우선합니다. 이 구성 세트 자체의 내용은 마지막에 그 결과 위에 적용됩니다.
  <p><b>구성 키:</b> 이 행이 내용을 가져오는 전역 구성 세트입니다.</p>
  <p><b>모드:</b> <b>활성</b>은 해당 구성 세트의 현재 활성 버전을 항상 따르므로, 그곳에서 새 버전을 활성화하면 여기 결과도 바뀝니다. <b>고정</b>은 행을 한 버전에 고정하며, 고정을 변경할 때까지 그대로 유지됩니다.</p>
  <p><b>고정 버전:</b> <b>고정</b> 모드에서 사용되는 버전 번호입니다. <b>활성</b> 모드에서는 사용되지 않습니다.</p>
</div>
