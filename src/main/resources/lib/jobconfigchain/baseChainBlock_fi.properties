baseChain.intro=Järjestetty luettelo perusasetusjoukoista, jotka otetaan käyttöön ylhäältä alas ennen {0} omaa ylikirjoitusta — myöhemmät rivit voittavat päällekkäisissä avaimissa. Jokainen rivi joko seuraa aina projektinsa tällä hetkellä aktiivista versiota tai on kiinnitetty tiettyyn aiempaan versioon. Järjestä rivit vetämällä niitä kahvasta (tai käytä siirrä ylös/alas -painikkeita). Napsauta rivin nuolipainiketta nähdäksesi sen ratkaistun (vain luku) sisällön tai uuden välilehden kuvaketta avataksesi kyseisen perusprojektin oman hallintasivun uudessa välilehdessä.
