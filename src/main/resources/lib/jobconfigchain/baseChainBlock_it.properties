baseChain.intro=Elenco ordinato di set di configurazione di base, applicati dall''alto in basso prima della sovrascrittura propria {0} — le righe successive prevalgono sulle chiavi sovrapposte. Ogni riga segue sempre la versione attualmente attiva del suo progetto oppure è fissata a una specifica versione storica. Trascina una riga dalla maniglia (o usa i pulsanti sposta su/sposta giù) per riordinarla. Fai clic sulla freccia di una riga per espandere il suo contenuto risolto (in sola lettura), oppure sull''icona di apertura in una nuova scheda per aprire la pagina di amministrazione di quel progetto di base in una nuova scheda.
