baseChain.intro=Lista ordenada de conjuntos de configuração base, aplicados de cima para baixo antes da sobrescrita própria {0} — as linhas posteriores prevalecem nas chaves sobrepostas. Cada linha acompanha sempre a versão ativa atual do seu projeto ou fica fixada em uma versão histórica específica. Arraste uma linha pela alça (ou use os botões de mover para cima/baixo) para reordená-la. Clique no botão de seta de uma linha para expandir o conteúdo resolvido dela (somente leitura), ou no ícone de abrir em nova guia para abrir a página de administração desse projeto base em uma nova guia.
