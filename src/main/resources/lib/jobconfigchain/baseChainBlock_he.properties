baseChain.intro=רשימה מסודרת של ערכות תצורה בסיסיות, שמוחלות מלמעלה למטה לפני העקיפה {0} — שורות מאוחרות יותר גוברות על מפתחות חופפים. כל שורה עוקבת תמיד אחרי הגרסה הפעילה כרגע של הפרויקט שלה, או מקובעת לגרסה היסטורית מסוימת. גרור שורה בידית האחיזה שלה (או השתמש בכפתורי ההזזה למעלה/למטה) כדי לסדר מחדש. לחץ על כפתור החץ של שורה כדי להרחיב את התוכן המפוענח שלה (לקריאה בלבד), או על סמל הפתיחה בלשונית חדשה כדי לפתוח את דף הניהול של פרויקט הבסיס בלשונית חדשה.
