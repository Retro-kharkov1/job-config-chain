baseChain.intro=Ordnet liste over basiskonfigurationssæt, der anvendes oppefra og ned, før den tilsidesættelse, der hører til {0} — senere rækker vinder ved overlappende nøgler. Hver række følger enten altid sit projekts aktuelt aktive version eller er fastgjort til én bestemt tidligere version. Træk en række i dens håndtag (eller brug knapperne til at flytte op/ned) for at ændre rækkefølgen. Klik på rækkens pileknap for at folde dens opløste (skrivebeskyttede) indhold ud, eller klik på ikonet for ny fane for at åbne det pågældende basisprojekts egen administrationsside i en ny fane.
