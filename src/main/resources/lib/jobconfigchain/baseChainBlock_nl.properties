baseChain.intro=Geordende lijst van basisconfiguratiesets, van boven naar beneden toegepast vóór de eigen override {0} — latere rijen winnen bij overlappende sleutels. Elke rij volgt ofwel altijd de momenteel actieve versie van haar project, ofwel is vastgezet op één specifieke eerdere versie. Sleep een rij aan de greep (of gebruik de knoppen omhoog/omlaag) om de volgorde te wijzigen. Klik op de chevronknop van een rij om de omgezette (alleen-lezen) inhoud uit te klappen, of klik op het pictogram voor een nieuw tabblad om de eigen beheerpagina van dat basisproject in een nieuw tabblad te openen.
