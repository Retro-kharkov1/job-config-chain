baseChain.intro=Urejen seznam osnovnih naborov konfiguracij, uporabljenih od zgoraj navzdol pred preglasitvijo {0} — poznejše vrstice zmagajo pri prekrivajočih se ključih. Vsaka vrstica bodisi vedno sledi trenutno aktivni različici svojega projekta bodisi se pripne na eno določeno zgodovinsko različico. Vrstni red spremenite tako, da vrstico povlečete za ročaj (ali uporabite gumba za premik navzgor / navzdol). Kliknite gumb s puščico v vrstici, da razširite njeno razrešeno vsebino (samo za branje), ali ikono za odpiranje v novem zavihku, da skrbniško stran tega osnovnega projekta odprete v novem zavihku.
