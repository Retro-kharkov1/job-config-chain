baseChain.intro=Temel Yapılandırma Kümelerinin sıralı listesi; yukarıdan aşağıya uygulanır, ardından {0} kendi geçersiz kılması uygulanır — çakışan anahtarlarda sonraki satırlar kazanır. Her satır ya projesinin o anda aktif olan versiyonunu her zaman izler ya da belirli bir geçmiş versiyona sabitlenir. Yeniden sıralamak için bir satırı tutamacından sürükleyin (veya yukarı/aşağı taşı düğmelerini kullanın). Çözümlenen (salt okunur) içeriğini genişletmek için satırın ok düğmesine tıklayın veya o temel projenin kendi yönetim sayfasını yeni sekmede açmak için yeni sekmede aç simgesine tıklayın.
