baseChain.intro=Llista ordenada de conjunts de configuració base, aplicats de dalt a baix abans de la sobreescriptura pròpia {0} — les files posteriors prevalen en les claus coincidents. Cada fila segueix sempre la versió activa actual del seu projecte o queda fixada a una versió històrica concreta. Arrossegueu una fila pel seu mànec (o utilitzeu els botons de moure amunt/avall) per reordenar-la. Feu clic al botó de fletxa d''una fila per desplegar-ne el contingut resolt (només lectura), o a la icona d''obrir en una pestanya nova per obrir la pàgina d''administració d''aquest projecte base en una pestanya nova.
