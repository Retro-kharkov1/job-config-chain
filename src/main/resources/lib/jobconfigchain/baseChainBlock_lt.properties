baseChain.intro=Surikiuotas bazinių konfigūracijos rinkinių sąrašas, taikomas iš viršaus į apačią prieš {0} perrašymą — vėlesnės eilutės nugali, kai raktai sutampa. Kiekviena eilutė arba visada seka savo projekto šiuo metu aktyvią versiją, arba yra prisegta prie vienos konkrečios ankstesnės versijos. Vilkite eilutę už jos rankenėlės (arba naudokite mygtukus perkelti aukštyn/žemyn), kad pakeistumėte tvarką. Spustelėkite eilutės rodyklės mygtuką, kad išskleistumėte jos išspręstą (tik skaitymui) turinį, arba naujo skirtuko piktogramą, kad to bazinio projekto paties administravimo puslapį atidarytumėte naujame skirtuke.
