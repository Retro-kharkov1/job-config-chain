baseChain.intro=Διατεταγμένη λίστα βασικών Συνόλων διαμόρφωσης, που εφαρμόζονται από πάνω προς τα κάτω πριν από την παράκαμψη {0} — οι μεταγενέστερες γραμμές υπερισχύουν σε επικαλυπτόμενα κλειδιά. Κάθε γραμμή είτε ακολουθεί πάντα την τρέχουσα ενεργή έκδοση του έργου της, είτε καρφιτσώνεται σε μια συγκεκριμένη παλαιότερη έκδοση. Σύρετε μια γραμμή από τη λαβή της (ή χρησιμοποιήστε τα κουμπιά μετακίνησης πάνω/κάτω) για αναδιάταξη. Κάντε κλικ στο κουμπί βέλους μιας γραμμής για να αναπτύξετε το επιλυμένο (μόνο για ανάγνωση) περιεχόμενό της ή στο εικονίδιο ανοίγματος σε νέα καρτέλα για να ανοίξετε τη δική της σελίδα διαχείρισης του βασικού έργου σε νέα καρτέλα.
