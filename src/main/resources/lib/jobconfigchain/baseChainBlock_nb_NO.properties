baseChain.intro=Ordnet liste over basiskonfigurasjonssett som brukes ovenfra og ned, før overstyringen som hører til {0} — senere rader vinner ved overlappende nøkler. Hver rad følger enten alltid prosjektets gjeldende aktive versjon, eller er festet til én bestemt tidligere versjon. Dra en rad i håndtaket (eller bruk knappene for å flytte opp/ned) for å endre rekkefølgen. Klikk på radens pilknapp for å vise det oppløste (skrivebeskyttede) innholdet, eller klikk på ikonet for ny fane for å åpne det aktuelle basisprosjektets egen administrasjonsside i en ny fane.
