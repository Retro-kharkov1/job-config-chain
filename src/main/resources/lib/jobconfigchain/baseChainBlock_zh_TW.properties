baseChain.intro=基底設定集的有序清單，由上而下依序套用，之後再套用{0}覆寫內容 — 鍵重疊時，後面的列優先。每一列要嘛一律追蹤其專案目前使用中的版本，要嘛固定在某個特定的歷史版本。拖曳列的抓取把手 (或使用上移/下移按鈕) 即可重新排序。按一下列的展開箭頭按鈕可展開其已解析的 (唯讀) 內容，按一下「在新分頁中開啟」圖示則會在新分頁中開啟該基底專案自己的管理頁面。
