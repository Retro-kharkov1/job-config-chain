baseChain.intro=Liste ordonnée de jeux de configuration de base, appliqués de haut en bas avant la surcharge propre {0} — les lignes suivantes l''emportent sur les clés en conflit. Chaque ligne suit soit toujours la version actuellement active de son projet, soit une version historique précise (épinglée). Faites glisser une ligne par sa poignée (ou utilisez les boutons monter/descendre) pour la réordonner. Cliquez sur le chevron d''une ligne pour afficher son contenu résolu (en lecture seule), ou sur l''icône d''ouverture dans un nouvel onglet pour ouvrir la page d''administration de ce projet de base dans un nouvel onglet.
