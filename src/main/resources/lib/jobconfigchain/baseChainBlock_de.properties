baseChain.intro=Geordnete Liste von Basis-Konfigurationssätzen, die von oben nach unten angewendet werden, bevor die eigene Überschreibung {0} greift — spätere Zeilen gewinnen bei überlappenden Schlüsseln. Jede Zeile folgt entweder stets der aktuell aktiven Version ihres Projekts oder ist auf eine bestimmte historische Version fixiert. Ziehen Sie eine Zeile am Griff (oder verwenden Sie die Schaltflächen „Nach oben“ und „Nach unten“), um sie umzusortieren. Klicken Sie auf den Pfeil einer Zeile, um ihren aufgelösten (schreibgeschützten) Inhalt aufzuklappen, oder auf das Symbol „In neuem Tab öffnen“, um die Verwaltungsseite dieses Basisprojekts in einem neuen Tab zu öffnen.
