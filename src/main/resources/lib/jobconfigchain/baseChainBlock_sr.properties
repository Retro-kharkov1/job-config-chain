baseChain.intro=Уређена листа основних скупова конфигурација, примењених одозго надоле пре сопственог преписивања {0} — каснији редови побеђују код преклапајућих кључева. Сваки ред или увек прати тренутно активну верзију свог пројекта, или се фиксира на једну одређену историјску верзију. Превуците ред за ручицу (или користите дугмад за померање нагоре / надоле) да бисте променили редослед. Кликните на дугме са стрелицом у реду да бисте проширили његов разрешени садржај (само за читање), или на иконицу за отварање у новој картици да бисте страницу администрације тог основног пројекта отворили у новој картици.
