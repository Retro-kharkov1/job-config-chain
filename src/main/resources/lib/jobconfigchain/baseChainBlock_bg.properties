baseChain.intro=Подреден списък на базови набори от конфигурации, прилагани отгоре надолу преди собственото припокриване на {0} — по-късните редове печелят при припокриващи се ключове. Всеки ред или винаги следва текущо активната версия на своя проект, или се фиксира към една конкретна историческа версия. Плъзнете реда за дръжката му (или използвайте бутоните за преместване нагоре / надолу), за да го преподредите. Щракнете върху бутона със стрелка на реда, за да разгънете разрешеното му съдържание (само за четене), или върху иконата за отваряне в нов раздел, за да отворите административната страница на този базов проект в нов раздел.
