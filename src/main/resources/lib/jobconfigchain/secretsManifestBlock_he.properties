secretsManifest.intro=נתיב שמופיע כאן נעול מבנית: העורך שלמטה יכול להכיל בנתיב הזה רק את ממלא המקום {0} כלשונו — אחרת השמירה נדחית. הערך האמיתי מסופק אך ורק דרך פרטי הגישה של Jenkins שנבחרו למטה, ואף פעם לא מוקלד כאן.
