baseChain.intro=Uporządkowana lista bazowych zestawów konfiguracji, stosowanych od góry do dołu przed nadpisaniem {0} — późniejsze wiersze wygrywają przy nakładających się kluczach. Każdy wiersz albo zawsze śledzi aktualnie aktywną wersję swojego projektu, albo przypina jedną konkretną wersję historyczną. Aby zmienić kolejność, przeciągnij wiersz za uchwyt (lub użyj przycisków przesunięcia w górę / w dół). Kliknij przycisk szewronu w wierszu, aby rozwinąć jego rozwiązaną zawartość (tylko do odczytu), albo ikonę otwarcia w nowej karcie, aby otworzyć stronę administracyjną tego projektu bazowego w nowej karcie.
