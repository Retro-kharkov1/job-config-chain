<div>
  ערכות תצורה שנמחקו נשמרות, עם כל היסטוריית הגרסאות שלהן, כך שאפשר לבטל מחיקה.
  <p>סמן <b>הצג מחוקים</b> כדי להציג אותן. <b>שחזר</b> מחזיר ערכת תצורה לשימוש בדיוק כפי שהייתה. <b>מחק לצמיתות</b> משמיד אותה ואת ההיסטוריה שלה ולא ניתן לבטל זאת; הפעולה נדחית כל עוד משימה עדיין מציינת את ערכת התצורה.</p>
</div>
