secretsManifest.intro=Μια διαδρομή που αναφέρεται εδώ είναι δομικά κλειδωμένη: ο παρακάτω επεξεργαστής μπορεί να περιέχει σε αυτή τη διαδρομή μόνο το κυριολεκτικό σύμβολο κράτησης θέσης {0} — διαφορετικά η αποθήκευση απορρίπτεται. Η πραγματική τιμή παρέχεται μόνο μέσω του διαπιστευτηρίου Jenkins που επιλέγεται παρακάτω και δεν πληκτρολογείται ποτέ εδώ.
