<div>
  קבע מספר גרסה מדויק במקום הגרסה הפעילה כרגע. השאר ריק כדי להשתמש בגרסה הפעילה.
  <p>בלי <b>מפתח תצורה</b> המספר הוא גרסה של התצורה של המשימה הזו; איתו, גרסה של ערכת התצורה הגלובלית ההיא. גרסה מפורשת גורמת לקריאה הזו להתעלם מקישור הפריסה של הבנייה, כך שעקיפה חד-פעמית מכוונת לעולם לא משנה את מה שהבנייה מתעדת.</p>
</div>
