<div>
  대상 파일과 확인 설정을 빌드의 나머지 부분에 대해 한 번 선언하므로, 이후의 <code>configChainValidate</code>와 <code>configChainSubstitute</code> 호출에서는 생략할 수 있습니다. 이후 호출에서 명시적으로 지정한 값은 매개변수별로 저장된 값을 재정의합니다.
  <p>저장된 상태가 전체 빌드에서 공유되므로 <code>parallel</code> 블록 안에서는 사용할 수 없습니다. 이전 이름인 <code>setupConfigTemplate</code>도 사용 중단된 별칭으로 계속 동작합니다.</p>
