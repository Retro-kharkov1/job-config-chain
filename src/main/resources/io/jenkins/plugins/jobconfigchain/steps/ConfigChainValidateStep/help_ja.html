<div>
  デプロイ前に、対象ファイルを有効な設定と照合して検証します。何も変更しません。ファイルに、対応するキーのない (誤字またはキーの欠落) <code>#{Dotted.Path}#</code> トークンが含まれている場合、ビルドは失敗します。どのトークンからも使われていないキーは、警告として報告されるだけです。
  <p>通常は、同じパラメータで <code>configChainSubstitute</code> の直前に呼び出します。例: <code>configChainValidate(file: &#39;app.json&#39;)</code>。</p>
</div>
