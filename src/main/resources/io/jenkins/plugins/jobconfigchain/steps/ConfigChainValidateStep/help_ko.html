  배포 전에 유효 구성을 기준으로 대상 파일을 검사하며 아무것도 변경하지 않습니다. 파일에 일치하는 키가 없는 (오타 또는 누락된 키) <code>#{Dotted.Path}#</code> 토큰이 있으면 빌드가 실패합니다. 어떤 토큰도 사용하지 않는 키는 경고로만 보고됩니다.
  <p>일반적으로 같은 매개변수로 <code>configChainSubstitute</code> 바로 앞에서 호출합니다. 예: <code>configChainValidate(file: &#39;app.json&#39;)</code>. 이전 이름인 <code>configTemplateValidate</code>도 사용 중단된 별칭으로 계속 동작합니다.</p>
