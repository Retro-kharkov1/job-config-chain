<div>
  対象ファイルと解決設定をビルドの残りの部分に対して一度だけ宣言します。これにより、後続の <code>configChainValidate</code> と <code>configChainSubstitute</code> の呼び出しでは省略できます。後の呼び出しで明示的に指定した値は、パラメータごとに保存済みの値を上書きします。
  <p>保存された状態はビルド全体で共有されるため、<code>parallel</code> ブロック内では使用できません。以前の名前 <code>setupConfigTemplate</code> も、非推奨のエイリアスとして引き続き使用できます。</p>
</div>
