<div>
  שם של ערכת תצורה גלובלית (משותפת) שיש לפענח ישירות, בין אם היא חלק משרשרת הבסיס של המשימה הזו ובין אם לא.
  <p>תקף רק יחד עם <b>שימוש בערכת תצורה בסיסית גלובלית</b>; בלעדיו הבנייה נכשלת. אם אין ערכת תצורה גלובלית בשם הזה, הבנייה נכשלת גם כן. קריאה לעולם לא יכולה להגיע לתצורה של משימה אחרת.</p>
</div>
