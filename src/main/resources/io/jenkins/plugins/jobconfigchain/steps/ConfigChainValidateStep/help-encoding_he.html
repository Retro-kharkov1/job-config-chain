<div>
  ערכת התווים שבה נקרא קובץ היעד, למשל <code>ISO-8859-1</code>. השאר ריק כדי לקרוא אותו כ-UTF-8; אם הקובץ אינו UTF-8 תקין, השלב רושם אזהרה וחוזר לערכת התווים המוגדרת כברירת מחדל של הסוכן, כך שקבצים קיימים ממשיכים לעבוד. ערך מפורש הוא קפדני: בלי חזרה לברירת מחדל ובלי אזהרה, ושם לא מוכר גורם לבנייה להיכשל.
</div>
